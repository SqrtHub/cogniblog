title: Blog CogniScion
description: >-
  Ideias, notas e aprendizados da CogniScion.
author:
  name: CogniScion
  type: Organization
  url: "https://cogniscion.com/"
email: ""
lang: pt-BR
locale: pt_BR
timezone: America/Sao_Paulo

url: "https://blog.cogniscion.com"
baseurl: ""

# Site do produto: identidade da marca (link do rodapé, autor/organização nos metadados)
product_url: "https://cogniscion.com/"
# Destino dos botões de ação (navbar e chamada no fim das páginas): criação de conta no app
signup_url: "https://cogniscion.com/educator/signup"

# Logo usado pelo jekyll-seo-tag no publisher (Organization) do JSON-LD
logo: /assets/img/cogniscion-logo.png

# Layouts, includes e CSS próprios; desativa o tema padrão do GitHub Pages
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# URLs sem data: /<slug>/ em português e /en/<slug>/ em inglês (a data fica só nos metadados).
permalink: /:title/

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/og-blog-cogniscion.png
        width: 1200
        height: 630
        alt: "Blog CogniScion"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Páginas em inglês (en/). Posts em inglês trazem lang/locale/permalink no próprio front matter.
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - tests
  - vendor
  - .bundle
  - .ruby-version
