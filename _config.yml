title: Blog CogniScion
description: >-
  Ideas, notes and lessons from CogniScion.
author:
  name: CogniScion
  type: Organization
  url: "https://cogniscion.com/"
email: ""
lang: en
locale: en_US
timezone: America/Sao_Paulo

url: "https://blog.cogniscion.com"
baseurl: ""

# Site do produto: identidade da marca (link do rodapé, autor/organização nos metadados)
product_url: "https://cogniscion.com/"
# Destino dos botões de ação (navbar e chamada no fim das páginas): criação de conta no app
signup_url: "https://cogniscion.com/educator/signup"

# Logo usado pelo jekyll-seo-tag no publisher (Organization) do JSON-LD
logo: /assets/img/cogniscion-logo.png

# Layouts, includes e CSS próprios; desativa o tema padrão do GitHub Pages
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Inglês é o idioma padrão, na raiz: /, /guides/, /about/, /feed.xml e posts em /<slug-em-inglês>/ (o
# permalink vem no front matter do post, gerado pelo CogniManager). Português fica em /pt/: /pt/, /pt/guias/,
# /pt/sobre/, /pt/feed.xml e posts em /pt/<slug>/ (este permalink; sem data: a data fica só nos metadados).
permalink: /pt/:title/

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/og-blog-cogniscion.png
        width: 1200
        height: 630
        alt: "Blog CogniScion"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Posts sem idioma no front matter são os originais em português. Posts em inglês trazem
      # lang/locale/permalink/translation_key no próprio front matter, que tem precedência.
      lang: pt-BR
      locale: pt_BR
  # Páginas em português (pt/).
  - scope:
      path: "pt"
    values:
      lang: pt-BR
      locale: pt_BR

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - tests
  - vendor
  - .bundle
  - .ruby-version
