<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.className = document.documentElement.className.replace("no-js", "js");</script>
  {%- seo %}
  {%- feed_meta %}
  <meta name="theme-color" content="#0D1B2A">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon-light.svg' | relative_url }}" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon-dark.svg' | relative_url }}" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/montserrat-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  {%- if page.breadcrumbs != false and page.url != "/" %}
  {%- include breadcrumbs-jsonld.html %}
  {%- endif %}
  <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
</head>
